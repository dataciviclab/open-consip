root: ../../out
schema_version: 1
dataset:
  name: consip_partecipazioni
  source_id: consip_open_data
  tags:
  - finanza-pubblica
  - consip
  - gare
  - imprese
  - partecipazioni
  category: appalti
  years:
  - 2024
  - 2025
  - 2026
  time_coverage:
    start_year: 2024
    end_year: 2026
raw:
  output_policy: overwrite
  sources:
  - name: consip_partecipazioni
    type: script
    client:
      timeout: 1800
    args:
      command: python3 ../../scripts/download_chunked.py "https://dati.consip.it/download/dataset/partecipazioni{year}.csv" "partecipazioni{year}.csv"
      output: "partecipazioni{year}.csv"
    primary: true
clean:
  sql: sql/clean.sql
  read:
    source: auto
    mode: largest
    delim: ','
    encoding: utf-8
    header: true
    ignore_errors: true
    parallel: false
  required_columns:
  - denominazione_iniziativa
  - denominazione_lotto
  - identificativo_lotto
  - tipo_strumento
  - partita_iva
  - ragione_sociale
  - forma_partecipazione
  - esito_partecipazione
  validate:
    min_rows: 10000
    not_null:
    - anno_riferimento
mart:
  tables:
  - name: mart_vincitori_per_strumento
    sql: sql/mart_vincitori_per_strumento.sql
  required_tables:
  - mart_vincitori_per_strumento
  validate:
    table_rules:
      mart_vincitori_per_strumento:
        required_columns:
        - anno_riferimento
        - tipo_strumento
        - esito_partecipazione
        - n_partecipazioni
        - n_imprese_distinte
        primary_key:
        - anno_riferimento
        - tipo_strumento
        - esito_partecipazione
        min_rows: 3
validation:
  fail_on_error: true
output:
  artifacts: standard
