root: "../../out"
schema_version: 1

dataset:
  name: "consip_composto"
  source_id: "dataciviclab_composite"
  tags: [finanza-pubblica, consip, compose, cross]
  category: finanza-pubblica
  description: "Compose CONSIP: snapshot unificato anno × regione da tutti i dataset Consip."
  years: [2024, 2025, 2026]
  time_coverage: {start_year: 2024, end_year: 2026}

# Compose: clean unifica tutti i dataset Consip a livello anno × regione.
# I mart derivano viste aggregate dal clean unificato.
# Eseguire prima: toolkit run per tutti i dataset singoli in datasets/.

raw:
  output_policy: overwrite
  sources:
    - name: "gare_asp"
      type: local_file
      args:
        path: "../../out/data/clean/consip_gare_asp/2024/consip_gare_asp_2024_clean.parquet"
        filename: "gare_asp.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - "anno"
    - "regione"
    - "n_gare"
    - "tasso_aggiudicazione"
    - "n_contratti_mepa"
    - "n_imprese_totali"
    - "spesa_utility"
    - "n_pa_totali"
  validate:
    not_null:
      - "anno"
    min_rows: 10

mart:
  tables:
    - name: "mart_riepilogo"
      sql: "sql/mart_riepilogo.sql"
  required_tables:
    - mart_riepilogo
  validate:
    table_rules:
      mart_riepilogo:
        min_rows: 10

duckdb:
  memory_limit: "4GB"

validation:
  fail_on_error: true

output:
  artifacts: "standard"
