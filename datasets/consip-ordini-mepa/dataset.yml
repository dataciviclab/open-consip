root: ../../out
schema_version: 1
dataset:
  name: consip_ordini_mepa
  source_id: consip_open_data
  tags:
  - finanza-pubblica
  - consip
  - ordini
  - mepa
  - spesa
  category: finanza-pubblica
  years:
  - 2024
  - 2025
  - 2026
  time_coverage:
    start_year: 2024
    end_year: 2026
raw:
  output_policy: overwrite
  sources:
  - name: consip_ordini_mepa
    type: script
    client:
      timeout: 600
    args:
      command: curl -sS -L --http1.1 --retry 3 --retry-delay 2 --max-time 600 -o "ordini-mepa-{year}.csv" "https://dati.consip.it/download/dataset/ordini-mepa-{year}.csv"
      output: "ordini-mepa-{year}.csv"
    primary: true
clean:
  sql: sql/clean.sql
  read:
    source: auto
    mode: largest
    delim: ','
    encoding: latin-1
    header: true
    ignore_errors: true
  required_columns:
  - anno_riferimento
  - regione_pa
  - descrizione_cpv
  - valore_ordini
  - n_ordini
  validate:
    min_rows: 1000
    not_null:
    - anno_riferimento
mart:
  tables:
  - name: mart_ordini_mepa_per_bene
    sql: sql/mart_ordini_mepa_per_bene.sql
  - name: mart_ordini_mepa_per_regione
    sql: sql/mart_ordini_mepa_per_regione.sql
  required_tables:
  - mart_ordini_mepa_per_bene
  - mart_ordini_mepa_per_regione
  validate:
    table_rules:
      mart_ordini_mepa_per_bene:
        required_columns:
        - anno_riferimento
        - bando_mepa
        - valore_ordini
        - n_righe
        primary_key:
        - anno_riferimento
        - bando_mepa
        min_rows: 2
      mart_ordini_mepa_per_regione:
        required_columns:
        - anno_riferimento
        - regione_pa
        - valore_ordini
        - n_righe
        primary_key:
        - anno_riferimento
        - regione_pa
        min_rows: 5
validation:
  fail_on_error: true
output:
  artifacts: standard
