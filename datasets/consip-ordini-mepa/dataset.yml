root: "../../out"
schema_version: 1

dataset:
  name: "consip_ordini_mepa"
  source_id: "consip_open_data"
  tags: [finanza-pubblica, consip, ordini, mepa, spesa]
  category: finanza-pubblica
  years: [2024, 2025, 2026]
  time_coverage: {start_year: 2024, end_year: 2026}

raw:
  output_policy: overwrite
  sources:
    - name: "consip_ordini_mepa_2024"
      type: "http_file"
      year: 2024
      args:
        url: "https://dati.consip.it/download/dataset/ordini-mepa-2024.csv"
        filename: "ordini-mepa-2024.csv"
      primary: true
    - name: "consip_ordini_mepa_2025"
      type: "http_file"
      year: 2025
      args:
        url: "https://dati.consip.it/download/dataset/ordini-mepa-2025.csv"
        filename: "ordini-mepa-2025.csv"
      primary: true
    - name: "consip_ordini_mepa_2026"
      type: "http_file"
      year: 2026
      args:
        url: "https://dati.consip.it/download/dataset/ordini-mepa-2026.csv"
        filename: "ordini-mepa-2026.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: largest
    delim: ","
    encoding: "latin-1"
    header: true
    ignore_errors: true
  required_columns: [anno_riferimento, regione_pa, descrizione_cpv, valore_ordini, n_ordini]
  validate:
    min_rows: 1000
    not_null: [anno_riferimento]

mart:
  tables:
    - name: "mart_ordini_mepa_per_bene"
      sql: "sql/mart_ordini_mepa_per_bene.sql"
    - name: "mart_ordini_mepa_per_regione"
      sql: "sql/mart_ordini_mepa_per_regione.sql"
  required_tables: [mart_ordini_mepa_per_bene, mart_ordini_mepa_per_regione]
  validate:
    table_rules:
      mart_ordini_mepa_per_bene:
        required_columns: [anno_riferimento, bando_mepa, valore_ordini, n_righe]
        primary_key: [anno_riferimento, bando_mepa]
        min_rows: 2
      mart_ordini_mepa_per_regione:
        required_columns: [anno_riferimento, regione_pa, valore_ordini, n_righe]
        primary_key: [anno_riferimento, regione_pa]
        min_rows: 5

validation:
  fail_on_error: true
