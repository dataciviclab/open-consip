root: ../../out
schema_version: 1
dataset:
  name: consip_consumi_convenzione
  source_id: consip_open_data
  tags:
  - finanza-pubblica
  - consip
  - consumi
  - convenzione
  category: finanza-pubblica
  years:
  - 2023
  - 2024
  - 2025
  time_coverage:
    start_year: 2023
    end_year: 2025
raw:
  output_policy: overwrite
  sources:
  - name: consip_consumi_convenzione_2023
    type: http_file
    year: 2023
    args:
      url: https://dati.consip.it/download/dataset/consumi-in-convenzione-2023.csv
      filename: consumi-in-convenzione-2023.csv
    primary: true
  - name: consip_consumi_convenzione_2024
    type: http_file
    year: 2024
    args:
      url: https://dati.consip.it/download/dataset/consumi-in-convenzione-2024.csv
      filename: consumi-in-convenzione-2024.csv
    primary: true
  - name: consip_consumi_convenzione_2025
    type: http_file
    year: 2025
    args:
      url: https://dati.consip.it/download/dataset/consumi-in-convenzione-2025.csv
      filename: consumi-in-convenzione-2025.csv
    primary: true
clean:
  sql: sql/clean.sql
  read:
    source: auto
    mode: largest
    delim: ','
    encoding: utf-8
    header: true
  required_columns:
  - anno_riferimento
  - tipologia_amministrazione
  - regione_pa
  - provincia_pa
  - sigla_provincia_pa
  - regione_fornitore
  - convenzione
  - lotto
  validate:
    min_rows: 100
    not_null:
    - anno_riferimento
    - convenzione
    - lotto
mart:
  tables:
    - name: "mart_spesa_per_territorio"
      sql: "sql/mart.sql"
  required_tables: [mart_spesa_per_territorio]
  validate:
    table_rules:
      mart_spesa_per_territorio:
        required_columns: [anno_riferimento, regione_pa, provincia_pa, tipologia_amministrazione, spesa_totale]
        primary_key: [anno_riferimento, regione_pa, provincia_pa, tipologia_amministrazione, regione_fornitore]
        min_rows: 10
validation:
  fail_on_error: true
output:
  artifacts: standard
